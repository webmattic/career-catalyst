name: Run Webinar Jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webinar jobs endpoint
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "x-cron-secret: ${{ secrets.PAGES_CRON_SECRET }}" \
            https://pragnyaconsultancy.com/api/jobs/run
